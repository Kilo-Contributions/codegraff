name: beta release

on:
  push:
    branches: ['release/v*']
  workflow_dispatch:

permissions:
  contents: write

# Publication is serialized across every release branch. The guard checks the
# remote head again after the builds, so queued work cannot revive an old beta.
concurrency:
  group: beta-release
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.beta.outputs.build }}
      version: ${{ steps.beta.outputs.version }}
      tag: ${{ steps.beta.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - name: Select the latest release branch head
        id: beta
        run: |
          python3 scripts/beta-release.py plan \
            --branch "$GITHUB_REF_NAME" --sha "$GITHUB_SHA" \
            --run-number "$GITHUB_RUN_NUMBER" --run-attempt "$GITHUB_RUN_ATTEMPT"

  cli:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-codegraff-zig
      - name: Cross-compile beta CLI
        env:
          BETA_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p beta-cli
          for target in aarch64-macos x86_64-macos x86_64-linux aarch64-linux x86_64-windows aarch64-windows; do
            zig build graff -Doptimize=ReleaseFast -Dtarget="$target" -Dversion="$BETA_VERSION"
            name="graff-$target"
            mkdir "$name"
            case "$target" in *-windows) bin=graff.exe ;; *) bin=graff ;; esac
            cp "zig-out/bin/$bin" "$name/$bin"
            cp README.md LICENSE "$name/"
            tar -czf "beta-cli/$name.tar.gz" "$name"
            rm -r "$name"
          done
          (cd beta-cli && sha256sum graff-*.tar.gz > SHA256SUMS)
      - uses: actions/upload-artifact@v7
        with:
          name: beta-cli
          path: beta-cli/
          if-no-files-found: error

  publish:
    needs: [plan, cli]
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: beta-cli
          path: beta-assets
      - name: Recheck release branch head
        id: fresh
        run: python3 scripts/beta-release.py guard --branch "$GITHUB_REF_NAME" --sha "$GITHUB_SHA"
      - name: Prepare beta notes
        if: steps.fresh.outputs.publish == 'true'
        env:
          BETA_TAG: ${{ needs.plan.outputs.tag }}
        run: |
          python3 scripts/beta-release.py notes \
            --branch "$GITHUB_REF_NAME" --sha "$GITHUB_SHA" \
            --tag "$BETA_TAG" --output beta-notes.md
      - name: Publish beta prerelease
        if: steps.fresh.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BETA_TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          test -f beta-assets/SHA256SUMS
          gh release create "$BETA_TAG" beta-assets/* \
            --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "$BETA_TAG" --notes-file beta-notes.md
